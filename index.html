<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width">

    <title>Deck Game Engine</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/selector.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>
    <main>
        <!-- GAME SELECTOR -->
        <section id="game-selector" class="screen active">

            <h1 class="selector-title">Choose your deck,<br>Adventurer!</h1>
    
            <div class="theme-grid">
    
                <!-- DECK DUNGEON - WORKING -->
                <button class="theme-card deck-dungeon"
                        type="button"
                        onclick="selectTheme('dungeon')">
        
                    <img src="assets/dungeon/logo.png"
                     class="theme-logo"
                     alt="Deck Dungeon">
        
                    <div class="theme-description">
                        Monsters. Weapons. Potions.<br>
                        Can you escape alive?
                    </div>
        
                    <div class="theme-description theme-action">
                        <strong>Enter the dungeon...</strong>
                    </div>
        
                </button>
    
                <!-- SHAUN OF THE DECK -->
                <button class="theme-card deck-shaun"
                        type="button"
                        onclick="selectTheme('shaun')">
        
                    <img src="assets/shaun/logo.png"
                     class="theme-logo"
                     alt="Shaun of the Deck">
        
                    <div class="theme-description">
                        Go to the Winchester, <br> have a nice cold pint, <br>
                        and wait for all of this to blow over.
                    </div>
        
                    <div class="theme-description theme-action">
                        <strong>You've got red on you.</strong>
                    </div>
        
                </button>
    
                <!-- SPACE DECK -->
                <button class="theme-card deck-space"
                        type="button"
                        onclick="selectTheme('space')">
        
                    <img src="assets/space/logo.png"
                     class="theme-logo"
                     alt="Space Deck">
        
                    <div class="theme-description">
                        You dock your mercenary ship and enter the derelict freighter.<br>
                        Wait. Something's moving...
                    </div>
        
                    <div class="theme-description theme-action">
                        <strong>Game over, man! Game over!</strong>
                    </div>
        
                </button>
    
                <!-- PIRATE -->
                <button class="theme-card deck-pirate"
                        type="button"
                        onclick="selectTheme('pirate')">
        
                    <img src="assets/pirate/logo.png"
                     class="theme-logo"
                     alt="Deck Dungeon">
        
                    <div class="theme-description">
                        'Arrgh me hearties! Sail the 7 seas.<br>
                        Protect yer booty from the sea-folk!
                    </div>
        
                    <div class="theme-description theme-action">
                        <strong>Set sail, for riches!</strong>
                    </div>
        
                </button>
    
                <!-- OCEAN DECK -->
                <button class="theme-card deck-ocean"
                        type="button"
                        onclick="selectTheme('ocean')">
        
                    <img src="assets/ocean/logo.png"
                     class="theme-logo"
                     alt="Ocean Deck">
        
                    <div class="theme-description">
                        Explore the deep.<br>
                        What will you discover?
                    </div>
        
                    <div class="theme-description theme-action">
                        <strong>Dive into the deep...</strong>
                    </div>
        
                </button>
    
                <!-- NINJA -->
                <button class="theme-card deck-ninja"
                        type="button"
                        onclick="selectTheme('ninja')">
        
                    <img src="assets/ninja/logo.png"
                     class="theme-logo"
                     alt="Deck of Shadows">
        
                    <div class="theme-description">
                        Sneak into the Shogun's palace unseen...<br>
                        Steal back what was taken from you!
                    </div>
        
                    <div class="theme-description theme-action">
                        <strong>Good luck, Shinobi!</strong>
                    </div>
        
                </button>
            </div>
        </section>

        <!-- RULES -->
        <section id="rules" class="screen">
        
          <div id="setupScreen" class="setup-screen">
            <div class="setup-controls">
              <div class="setup-fields">
                <div class="form-group">
                  <label for="modeSelect">Game Mode</label>
                  <select id="modeSelect" onchange="toggleModeInputs()">
                    <option value="solo_dagger">Solitaire (1 Player)</option>
                    <option value="coop">Co-op (2 Players)</option>
                  </select>
                </div>

                <div class="form-group" id="p1Group">
                  <div class="player-name-field">
                    <label id="p1Label" for="p1NameInput">Player Name</label>
                    <input type="text" id="p1NameInput" value="Hero 1" maxlength="20">
                  </div>
                  <input type="hidden" id="p1PortraitInput" value="">
                </div>

                <div class="form-group" id="p2Group" style="display: none;">
                  <div class="player-name-field">
                    <label for="p2NameInput">Player 2 Name</label>
                    <input type="text" id="p2NameInput" value="Hero 2" maxlength="20">
                  </div>
                  <input type="hidden" id="p2PortraitInput" value="">
                </div>

                <div class="sound-control" aria-label="Sound controls">
                  <button type="button" class="sound-toggle" id="soundToggle" onclick="toggleAudio()" aria-pressed="true">
                    <span class="sound-icon" aria-hidden="true">♪</span>
                    <span id="soundToggleLabel">Sound On</span>
                  </button>
                </div>
              </div>

              <div class="setup-portrait" id="portraitSetup">
                <div class="portrait-pickers">
                  <div class="portrait-choice" id="p1PortraitChoice">
                    <div class="portrait-choice-label">Player 1</div>
                    <div class="portrait-picker" id="p1PortraitPicker" aria-label="Choose Player 1 portrait"></div>
                  </div>
                  <div class="portrait-choice" id="p2PortraitChoice" style="display: none;">
                    <div class="portrait-choice-label">Player 2</div>
                    <div class="portrait-picker" id="p2PortraitPicker" aria-label="Choose Player 2 portrait"></div>
                  </div>
                </div>
                <div class="portrait-hint"><em>Click a portrait to cycle</em></div>
              </div>
            </div>
        
            <button type="button" class="primary-btn" id="startBtn" onclick="enterGame()">Enter Game</button>

            <div class="dungeon-id-entry">
              <label for="deckIdInput">Have a Deck ID?</label>
              <div class="dungeon-id-row">
                <input type="text" id="deckIdInput" maxlength="11" autocomplete="off" spellcheck="false" placeholder="11-character Deck ID">
                <button type="button" class="primary-btn" onclick="enterDungeonId()">Enter THIS Deck</button>
              </div>
            </div>

            <div class="setup-rules" id="setupRulesText"></div>
            
            <div class="hard-mode-option">
              <label class="hard-mode-label">
                <input type="checkbox" id="hardModeInput">
                <span><strong>Hard Mode</strong> — Monsters fought with weapon must be strictly <em>less than</em> the previous monster slain value.</span>
              </label>
              <label class="hard-mode-label ultra-hard-label">
                <input type="checkbox" id="ultraHardModeInput" onchange="toggleUltraHardMode()">
                <span><strong>Ultra Hard Mode</strong> — Weapon cards cannot be discarded.</span>
              </label>
            </div>
          </div>          </div>
        </section>
    
        <!-- Game UI -->
        <section id="game-ui" class="screen">
  
            <div id="game" style="display: none;" class="game-layout">
                <div class="game-canvas">
                    <!-- Decision overlay: shared decision point for solo and co-op. -->
                    <div id="decisionOverlay" class="decision-overlay" hidden>
                        <div class="decision-panel" role="dialog" aria-modal="true" aria-labelledby="decisionTitle">
                            <div class="decision-header">
                                <div class="decision-title-wrap">
                                    <h2 id="decisionTitle">Choose</h2>
                                    <p id="decisionPrompt"></p>
                                </div>
                            </div>
                            <div id="decisionOptions" class="decision-options"></div>
                            <button id="decisionBack" class="decision-back" type="button" aria-label="Back">← Back</button>
                        </div>
                    </div>


                    <!-- 1. HP TRACK -->
                    <div id="p1Bar" class="ascii-health-bar canvas-health-track"></div>

                    <!-- 2. PLAYER AREA — solo and co-op use separate layouts so the
                         existing solo board remains untouched while co-op gets its own footprint. -->
                    <div class="card-area canvas-player-area" id="playersContainer">
                        <div class="card-grid solo-player-grid" id="playerCardGrid">
                            <div id="p1Deck" class="card-anchor" aria-label="Deck"></div>

                            <div id="p1Panel" class="card player-character-card" aria-label="Player">
                                <div class="player-character-inner">
                                    <div class="player-header">
                                        <strong id="p1DisplayName">Hero 1</strong>
                                        <span id="p1Down"></span>
                                    </div>
                                    <img id="p1Portrait" class="player-portrait" src="" alt="">
                                    <div class="player-hp" id="p1HpDisplay">HP 20/20</div>
                                </div>
                            </div>

                            <div id="p1Weapon" class="card-anchor" aria-label="Weapon"></div>
                            <div id="p1PreviousMonster" class="card-anchor" aria-label="Previous Monster"></div>
                        </div>

                        <div class="card-grid coop-player-grid" id="coopPlayerCardGrid" hidden>
                            <div id="coopDeck" class="card-anchor" aria-label="Deck"></div>

                            <div id="coopP1Panel" class="card player-character-card" aria-label="Player 1">
                                <div class="player-character-inner">
                                    <div class="player-header">
                                        <strong id="coopP1DisplayName">Hero 1</strong>
                                        <span id="coopP1Down"></span>
                                    </div>
                                    <img id="coopP1Portrait" class="player-portrait" src="" alt="">
                                    <div class="player-hp" id="coopP1HpDisplay">HP 10/10</div>
                                </div>
                            </div>

                            <div id="coopP2Panel" class="card player-character-card" aria-label="Player 2">
                                <div class="player-character-inner">
                                    <div class="player-header">
                                        <strong id="coopP2DisplayName">Hero 2</strong>
                                        <span id="coopP2Down"></span>
                                    </div>
                                    <img id="coopP2Portrait" class="player-portrait" src="" alt="">
                                    <div class="player-hp" id="coopP2HpDisplay">HP 10/10</div>
                                </div>
                            </div>

                            <div id="duelCard" class="card duel-card" aria-label="Duel">
                                <div class="duel-quadrant duel-p1-weapon" aria-label="Player 1 weapon">
                                    <div id="coopP1Weapon" class="duel-info"></div>
                                </div>
                                <div class="duel-quadrant duel-p2-weapon" aria-label="Player 2 weapon">
                                    <div id="coopP2Weapon" class="duel-info"></div>
                                </div>
                                <div class="duel-quadrant duel-p1-previous" aria-label="Player 1 previous monster">
                                    <div id="coopP1Previous" class="duel-info"></div>
                                </div>
                                <div class="duel-quadrant duel-p2-previous" aria-label="Player 2 previous monster">
                                    <div id="coopP2Previous" class="duel-info"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 3. ROOM TRACK -->
                    <div id="deckProgress" class="ascii-dungeon-progress canvas-room-track"></div>

                    <!-- 4. DUNGEON CARDS — four cards in the artwork-defined dungeon area -->
                    <div class="card-area canvas-dungeon-area">
                        <div class="card-grid" id="dungeon"></div>
                    </div>

                    <!-- 5. BUTTONS -->
                    <div class="action-panel canvas-action-area">
                        <div class="action-row">
                            <div class="action-buttons">
                                <button id="action1" class="context-action"></button>
                                <button id="action2" class="context-action"></button>
                                <button type="button" id="undoBtn" onclick="undoLastAction()" disabled>↩ Undo</button>
                                <button type="button" id="refreshBtn" onclick="refreshDungeon()">Flee</button>
                            </div>
                        </div>
                    </div>

                    <!-- 6. LOG -->
                    <div class="log-box canvas-log-area" id="log"></div>
                </div>

                <!-- Co-op player state is rendered inside the canvas above. -->
            </div>        
            <!-- Modal Dialog -->
            <div class="modal-overlay" id="overlay">
              <div class="modal">
                <h2 id="modalTitle">Game Over</h2>
                <div id="modalScore" class="score-banner"></div>

                <div class="mode-badge-wrap">
                  <div id="modeBadge" class="mode-badge" aria-label="Run difficulty"></div>
                </div>

                <p id="modalText"></p>

                <!-- Run Summary Card -->
                <div class="summary-grid">
                  <div class="summary-row"><span>Monsters Slain:</span> <strong id="summarySlain">0 / 26</strong></div>
                  <div class="summary-row"><span>Rooms Cleared:</span> <strong id="summaryRooms">0 / 14</strong></div>
                  <div class="summary-row"><span>Best Weapon:</span> <strong id="summaryFavWeapon">Bare Fists (0 damage dealt)</strong></div>
                  <div class="summary-row"><span>HP Restored:</span> <strong id="summaryFood">0 / 54</strong></div>
                  <div class="summary-row"><span>Flee Count:</span> <strong id="summaryFled">0</strong></div>
                </div>

                <div class="deck-id-modal">
                  <span>Deck ID:</span>
                  <strong id="modalDeckId"></strong>
                  <button type="button" class="secondary-btn" id="copyDeckIdBtn" onclick="copyDeckId()">Copy Deck ID</button>
                  <button type="button" class="secondary-btn" id="copyLogBtn" onclick="copyLogText()">Copy Log Text</button>
                </div>
            
                <div class="run-chart">
                  <div class="run-chart-title"><strong>Run History</strong><span>HP over time</span></div>
                  <div id="runChart" aria-label="Run history chart"></div>
                  <div id="runChartLegend" class="run-chart-legend" aria-label="Run history legend"></div>
                </div>
            
                <button type="button" class="peek-btn" id="peekBtn">Hold [V] or Tap & Hold to Peek Board</button>
                <button type="button" class="undo-modal-btn" id="modalUndoBtn" onclick="undoFromGameOver()">↩ Undo Fatal Error</button>
                <div class="modal-actions">
                  <button type="button" class="primary-btn" id="modalBtn" onclick="replayGame()">Play This Deck Again</button>
                  <button type="button" class="primary-btn" id="modalRandomBtn" onclick="newRandomGame()">New Random Deck</button>
                  <button type="button" class="secondary-btn" id="modalMenuBtn" onclick="backToMenu()">Return to Menu</button>
                </div>
              </div>
            </div>
        </section>
    </main>
    
    <script src="js/audio.js"></script>
    <script src="js/themes.js"></script>
    <script src="js/cards.js"></script>
    <script src="js/deck-id.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
