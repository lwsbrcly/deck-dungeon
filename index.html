<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Deck Dungeon</title>
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1e1e24;
      --panel-bg: #18181c;
      --border: #2e2e38;
      --text: #e1e1e6;
      --muted: #8d8d99;
      --red: #e55555;
      --green: #47d16c;
      --gold: #f1c40f;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      -webkit-tap-highlight-color: rgba(0,0,0,0);
    }
    
    body { 
      background: var(--bg); 
      color: var(--text); 
      display: flex; 
      justify-content: center; 
      padding: 10px; 
      min-height: 100vh; 
    }
    
    .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 10px; }
    header { text-align: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    h1 { font-size: 1.5rem; color: #fff; letter-spacing: 1px; }

    /* Setup Screen */
    .setup-screen { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; text-align: center; }
    .form-group { margin-bottom: 12px; text-align: left; }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
    select, input { width: 100%; padding: 8px; background: var(--bg); border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 0.9rem; -webkit-appearance: none; appearance: none; }
    
    button.primary-btn { 
      width: 100%; 
      padding: 12px; 
      background: #3b82f6; 
      color: #fff; 
      font-weight: bold; 
      border: none; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 1rem; 
      -webkit-appearance: none;
      touch-action: manipulation;
    }

    .setup-rules { font-size: 0.78rem; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 12px; text-align: left; margin-bottom: 12px; line-height: 1.4; }
    .setup-rules h3 { color: var(--gold); font-size: 0.85rem; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .setup-rules ul { padding-left: 16px; margin-bottom: 8px; }
    .setup-rules li { margin-bottom: 4px; }

    /* Game Layout */
    .game-layout { display: flex; flex-direction: column; gap: 10px; }

    .players-container { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .players-container.solo-mode { grid-template-columns: 1fr; }

    .player-panel { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .player-panel.downed { opacity: 0.5; border-color: var(--red); }
    .player-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    
    /* Progress Bars */
    .bar-bg { background: #2a2a32; height: 8px; border-radius: 4px; overflow: hidden; width: 100%; margin-top: 4px; }
    .bar-fill { height: 100%; width: 100%; transition: width 0.3s ease, background-color 0.3s ease; }
    .hp-fill { background: var(--green); }

    /* Weapon & Item Display Slot */
    .slot { 
      background: var(--bg); 
      border: 1px dashed var(--border); 
      border-radius: 6px; 
      padding: 6px; 
      min-height: 125px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      text-align: center; 
    }
    .slot-label { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
    .slot-meta { font-size: 0.75rem; margin-top: 4px; color: var(--text); font-weight: 500; }

    /* Dungeon & Cards */
    .dungeon-section { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
    .dungeon-header { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
    .dungeon-title-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    .dungeon-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .dungeon-card-wrap { display: flex; justify-content: center; width: 100%; }

    /* Cards */
    .card { 
      width: 100%; 
      max-width: 80px; 
      aspect-ratio: 2 / 3; 
      background: var(--card-bg); 
      border: 1.5px solid var(--border); 
      border-radius: 5px; 
      padding: 4px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      cursor: pointer; 
      user-select: none; 
      -webkit-user-select: none;
      position: relative; 
      box-sizing: border-box;
      overflow: hidden;
    }
    .card.selected { border-color: var(--gold); box-shadow: 0 0 8px rgba(241, 196, 15, 0.4); }
    .card.red { color: var(--red); }
    .card.black { color: #fff; }
    .card.empty { border: 1px dashed var(--border); background: transparent; cursor: default; }
    
    .corner { font-weight: bold; font-size: 0.62rem; line-height: 1.05; z-index: 2; }
    .suitbig { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.2rem; opacity: 0.2; pointer-events: none; }
    
    /* SVG Custom Artwork Styling */
    .card-art {
      position: absolute;
      top: 54%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 52%;
      height: 52%;
      pointer-events: none;
      opacity: 0.85;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-art svg {
      width: 100%;
      height: 100%;
      stroke: currentColor;
    }

    .card-title { 
      font-size: 0.55rem; 
      text-align: center; 
      line-height: 1.05; 
      width: 100%;
      white-space: normal;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-word;
      z-index: 2;
    }

    /* Controls & Actions */
    .action-panel { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
    .action-group { display: none; margin-top: 8px; }
    .action-group.show { display: block; }
    .btn-grid { display: grid; gap: 6px; }
    
    button { 
      padding: 8px 10px; 
      background: #2a2a36; 
      color: #fff; 
      border: 1px solid var(--border); 
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 0.8rem; 
      touch-action: manipulation;
      -webkit-appearance: none;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Log */
    .log-box { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; height: 70px; overflow-y: auto; padding: 6px; font-family: monospace; font-size: 0.75rem; color: var(--muted); }
    .logline { margin-bottom: 2px; }

    .badge { background: var(--red); color: #fff; padding: 1px 4px; border-radius: 3px; font-size: 0.65rem; font-weight: bold; }
    
    /* Modal Dialog & Lightened Backdrop */
    .modal-overlay { 
      display: none; 
      position: fixed; 
      top: 0; left: 0; right: 0; bottom: 0; 
      background: rgba(0, 0, 0, 0.45); 
      z-index: 100; 
      align-items: center; 
      justify-content: center; 
      padding: 20px; 
      transition: opacity 0.15s ease;
    }
    .modal-overlay.show { display: flex; }
    .modal-overlay.peek-hidden { opacity: 0; pointer-events: none; }

    .modal { background: rgba(24, 24, 28, 0.95); border: 1px solid var(--border); border-radius: 8px; padding: 20px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal h2 { margin-bottom: 4px; color: #fff; font-size: 1.2rem; }
    .modal p { color: var(--muted); margin-bottom: 12px; font-size: 0.85rem; line-height: 1.4; }
    .score-banner { font-size: 1.5rem; font-weight: bold; margin: 6px 0 12px 0; color: var(--gold); }
    .score-banner.negative { color: var(--red); }

    /* Summary Card Grid */
    .summary-grid {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
      font-size: 0.78rem;
    }
    .summary-row { display: flex; justify-content: space-between; align-items: center; }
    .summary-row span { color: var(--muted); }
    .summary-row strong { color: #fff; font-weight: 600; }

    /* Run History Chart */
    .run-chart {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px;
      margin-bottom: 12px;
      text-align: left;
    }
    .run-chart-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 0 2px 6px;
      font-size: 0.78rem;
    }
    .run-chart-title strong { color: #fff; }
    .run-chart-title span { color: var(--muted); font-size: 0.68rem; }
    .run-chart svg { width: 100%; height: auto; display: block; }
    .run-chart-legend { display: flex; flex-wrap: wrap; gap: 7px 14px; align-items: center; padding: 9px 3px 1px; color: var(--muted); font-size: 10px; }
    .run-chart-legend-item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .run-chart-legend-line { width: 18px; height: 0; border-top: 2px solid #e1e1e6; display: inline-block; }
    .run-chart-legend-line.p2 { border-top-style: dashed; opacity: 0.72; }
    .run-chart-legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; border: 1px solid var(--bg); }
    .run-chart-legend-dot.monster { background: #e55555; }
    .run-chart-legend-dot.weapon { background: var(--gold); }
    .run-chart-legend-dot.potion { background: #47d16c; }
    .run-chart-legend-dot.flee { background: #6f8ea8; }
    .run-chart .grid-line { stroke: var(--border); stroke-width: 1; }
    .run-chart .axis-line { stroke: #5a5a66; stroke-width: 1; }
    .run-chart .axis-label { fill: var(--muted); font-size: 10px; }
    .run-chart .panel-label { fill: var(--text); font-size: 11px; font-weight: 600; }
    .run-chart .hp-line { fill: none; stroke: #e1e1e6; stroke-width: 2.5; }
    .run-chart .hp-line.p2 { stroke-dasharray: 6 4; opacity: 0.72; }
    .run-chart .weapon-line { fill: none; stroke: var(--gold); stroke-width: 2.2; stroke-dasharray: 5 3; }
    .run-chart .event-dot { stroke: var(--bg); stroke-width: 1.5; }
    .run-chart .event-dot.monster { fill: #e55555; }
    .run-chart .event-dot.weapon { fill: var(--gold); }
    .run-chart .event-dot.potion { fill: #47d16c; }
    .run-chart .event-dot.flee { fill: #6f8ea8; }
    .run-chart .event-dot.other { fill: #8d8d99; }
    .run-chart .event-dot.alt { opacity: 0.55; }
    .run-chart .weapon-equip-dot { fill: var(--gold); stroke: #fff; stroke-width: 1.2; }
    .run-chart .legend { font-size: 10px; fill: var(--muted); }
    .run-chart .legend-line { stroke-width: 2; }

    .peek-btn {
      width: 100%;
      background: transparent;
      border: 1px dashed var(--muted);
      color: var(--muted);
      margin-bottom: 10px;
      padding: 6px;
      font-size: 0.75rem;
    }
    .peek-btn:active { background: rgba(255,255,255,0.1); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>DECK DUNGEON</h1>
  </header>

  <!-- Setup Screen -->
  <div id="setupScreen" class="setup-screen">
    <div class="form-group">
      <label for="modeSelect">Game Mode</label>
      <select id="modeSelect" onchange="toggleModeInputs()">
        <option value="solo">Solitaire (1 Player)</option>
        <option value="coop">Co-op (2 Players Hardcore)</option>
        <option value="solo_dagger">Solitaire (Starter Dagger)</option>
      </select>
    </div>
    
    <div class="form-group" id="p1Group">
      <label id="p1Label" for="p1NameInput">Player Name</label>
      <input type="text" id="p1NameInput" value="Hero 1">
    </div>
    
    <div class="form-group" id="p2Group" style="display: none;">
      <label for="p2NameInput">Player 2 Name</label>
      <input type="text" id="p2NameInput" value="Hero 2">
    </div>

    <div class="setup-rules" id="setupRulesText"></div>

    <button type="button" class="primary-btn" id="startBtn" onclick="startGame()">Enter Dungeon</button>
  </div>

  <!-- Game UI -->
  <div id="game" style="display: none;" class="game-layout">

    <!-- Players Container -->
    <div class="players-container" id="playersContainer">
      <!-- Player 1 -->
      <div id="p1Panel" class="player-panel">
        <div class="player-header">
          <strong id="p1DisplayName">Hero 1</strong>
          <span id="p1Down"></span>
        </div>
        <div>
          <span style="font-size: 0.75rem; color: var(--muted);">HP: </span>
          <span id="p1HP" style="font-size: 0.75rem;">20 / 20</span>
          <div class="bar-bg"><div id="p1Bar" class="bar-fill hp-fill"></div></div>
        </div>
        <div class="slot">
          <div class="slot-label">Weapon</div>
          <div id="p1Weapon" style="width: 100%; display: flex; justify-content: center;"></div>
          <div class="slot-meta" id="p1WeaponMeta">Empty</div>
        </div>
      </div>

      <!-- Player 2 -->
      <div id="p2Panel" class="player-panel">
        <div class="player-header">
          <strong id="p2DisplayName">Hero 2</strong>
          <span id="p2Down"></span>
        </div>
        <div>
          <span style="font-size: 0.75rem; color: var(--muted);">HP: </span>
          <span id="p2HP" style="font-size: 0.75rem;">10 / 10</span>
          <div class="bar-bg"><div id="p2Bar" class="bar-fill hp-fill"></div></div>
        </div>
        <div class="slot">
          <div class="slot-label">Weapon</div>
          <div id="p2Weapon" style="width: 100%; display: flex; justify-content: center;"></div>
          <div class="slot-meta" id="p2WeaponMeta">Empty</div>
        </div>
      </div>
    </div>

    <!-- Dungeon Room -->
    <div class="dungeon-section">
      <div class="dungeon-header">
        <div class="dungeon-title-row">
          <strong>Dungeon Progress</strong>
          <span style="color: var(--muted); font-size: 0.75rem;">Deck: <span id="deckCountText">0 / 0</span></span>
        </div>
        <div class="bar-bg">
          <div id="deckBar" class="bar-fill"></div>
        </div>
      </div>
      <div class="dungeon-grid" id="dungeon"></div>
    </div>

    <!-- Controls -->
    <div class="action-panel">
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem;">
        <span id="selectedLabel" style="font-weight: bold; color: var(--gold);">Select a card</span>
        <div style="display: flex; gap: 6px;">
          <button type="button" id="undoBtn" onclick="undoLastAction()" disabled>↩ Undo</button>
          <button type="button" id="refreshBtn" onclick="refreshDungeon()">Flee</button>
        </div>
      </div>

      <div id="fightOptions" class="action-group">
        <div class="btn-grid" id="fightGrid"></div>
      </div>

      <div id="weaponOptions" class="action-group">
        <div class="btn-grid" id="weaponGrid"></div>
      </div>

      <div id="potionOptions" class="action-group">
        <div class="btn-grid" id="potionGrid"></div>
      </div>
    </div>

    <!-- Log -->
    <div class="log-box" id="log"></div>
  </div>
</div>

<!-- Modal Dialog -->
<div class="modal-overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Game Over</h2>
    <div id="modalScore" class="score-banner"></div>
    <p id="modalText"></p>

    <!-- Run Summary Card -->
    <div class="summary-grid">
      <div class="summary-row"><span>Monsters Slain:</span> <strong id="summarySlain">0 / 26</strong></div>
      <div class="summary-row"><span>Rooms Cleared:</span> <strong id="summaryRooms">0 / 14</strong></div>
      <div class="summary-row"><span>Best Weapon:</span> <strong id="summaryFavWeapon">Bare Fists (0 damage dealt)</strong></div>
      <div class="summary-row"><span>Food Consumed:</span> <strong id="summaryFood">0 / 54 HP</strong></div>
    </div>

    <div class="run-chart">
      <div class="run-chart-title"><strong>Run History</strong><span>health over event order</span></div>
      <div id="runChart" aria-label="Run history chart"></div>
      <div id="runChartLegend" class="run-chart-legend" aria-label="Run history legend"></div>
    </div>

    <button type="button" class="peek-btn" id="peekBtn">Hold [V] or Tap & Hold to Peek Board</button>
    <button type="button" class="primary-btn" id="modalBtn" onclick="restartSetup()">Play Again</button>
  </div>
</div>

  const BONE_DRAGON_SVG = `<svg viewBox="0 0 835 821" xmlns="http://www.w3.org/2000/svg">

  var state = {};
  var historyStack = [];

  function saveState() {
    historyStack.push(JSON.parse(JSON.stringify(state)));
    if (historyStack.length > 30) historyStack.shift();
  }

  function undoLastAction() {
    if (historyStack.length === 0) return;
    state = historyStack.pop();
    log('Undid last action.', false);
    render();
  }

  function toggleModeInputs() {
    var modeSelect = document.getElementById('modeSelect');
    var mode = modeSelect ? modeSelect.value : 'solo';
    var p2Group = document.getElementById('p2Group');
    var p1Label = document.querySelector('#p1Group label');
    var setupRules = document.getElementById('setupRulesText');

    var baseRules = '<h3>Goal of the Game</h3>' +
      '<p style="margin-bottom: 8px;">Survive the dungeon by clearing ALL cards in the deck! Finishing with remaining HP gives a positive score, while dying results in a negative score equal to remaining monster health.</p>' +
      '<h3>Card Types</h3>' +
      '<ul>' +
        '<li><strong>♠ Clubs & Spades (Monsters):</strong> Deal damage equal to their value. Fight bare-handed or absorb damage with a weapon.</li>' +
        '<li><strong>♦ Diamonds (Weapons):</strong> Equip to reduce monster damage. Weapons break down over time—they can only strike monsters equal to or weaker than the last monster slain.</li>' +
        '<li><strong>♥ Hearts (Potions):</strong> Restore HP equal to their card value (capped at your max HP). Only 1 potion provides healing per room (extra potions can be discarded or consumed for 0 HP)!</li>' +
      '</ul>' +
      '<h3>Room Mechanics</h3>' +
      '<ul>' +
        '<li><strong>Clear Room:</strong> Clear 3 cards to deal the next 3 from the deck.</li>' +
        '<li><strong>Fleeing:</strong> Press <em>Flee</em> to skip a dangerous room. The next room is dealt immediately, and the fled cards are shuffled back into the deck. You cannot flee twice in a row!</li>' +
      '</ul>';

    if (mode === 'coop') {
      if (p2Group) p2Group.style.display = 'block';
      if (p1Label) p1Label.textContent = 'Player 1 Name';
      if (setupRules) {
        setupRules.innerHTML = baseRules + 
          '<h3>Co-op Hardcore Rules</h3>' +
          '<ul>' +
            '<li><strong>HP Limit:</strong> Both heroes start with 10 HP.</li>' +
            '<li><strong>2v1 Attacks:</strong> Team up with weapons or fists against a monster to split incoming damage evenly.</li>' +
            '<li><strong>Revives:</strong> Use a potion on a downed ally to revive them with (Potion Value / 2) + 1 HP.</li>' +
          '</ul>';
      }
    } else if (mode === 'solo_dagger') {
      if (p2Group) p2Group.style.display = 'none';
      if (p1Label) p1Label.textContent = 'Player Name';
      if (setupRules) {
        setupRules.innerHTML = baseRules + 
          '<h3>Starter Dagger Solitaire Rules</h3>' +
          '<ul>' +
            '<li><strong>HP Limit:</strong> Start with 20 HP.</li>' +
            '<li><strong>Pre-equipped:</strong> You start with the <strong>2♦ Dagger</strong> equipped!</li>' +
            '<li><strong>Clean Finish:</strong> The 2♦ Dagger is removed from the deck (43 cards), allowing the run to conclude cleanly in 14 full rooms.</li>' +
          '</ul>';
      }
    } else {
      if (p2Group) p2Group.style.display = 'none';
      if (p1Label) p1Label.textContent = 'Player Name';
      if (setupRules) {
        setupRules.innerHTML = baseRules + 
          '<h3>Solitaire Rules</h3>' +
          '<ul>' +
            '<li><strong>HP Limit:</strong> Start with 20 HP.</li>' +
            '<li>Manage your weapons carefully and save high-value potions for when you take massive hits!</li>' +
          '</ul>';
      }
    }
  }

  function showSetupScreen() {
    document.getElementById('setupScreen').style.display = 'block';
    document.getElementById('game').style.display = 'none';
    toggleModeInputs();
  }

  function restartSetup() {
    document.getElementById('overlay').classList.remove('show');
    showSetupScreen();
  }

  function makeDeck(excludeDagger) {
    var d = [];
    var suitKeys = Object.keys(SUITS);
    for (var i = 0; i < suitKeys.length; i++) {
      var suit = suitKeys[i];
      for (var j = 0; j < ranks.length; j++) {
        var rank = ranks[j];
        if ((suit === 'diamonds' || suit === 'hearts') && ['A','J','Q','K'].indexOf(rank) !== -1) continue;
        if (excludeDagger && suit === 'diamonds' && rank === '2') continue;
        d.push({
          suit: suit,
          rank: rank,
          value: value(rank),
          name: CARD_NAMES[suit][rank],
          id: suit + rank
        });
      }
    }
    return shuffle(d);
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = a[i];
      a[i] = a[j];
      a[j] = temp;
    }
    return a;
  }

  function startGame() {
    var modeInput = document.getElementById('modeSelect');
    var mode = modeInput ? modeInput.value : 'solo';
    var p1Val = document.getElementById('p1NameInput').value.trim();
    var p2Val = document.getElementById('p2NameInput').value.trim();
    var p1Name = p1Val || ((mode === 'solo' || mode === 'solo_dagger') ? 'Player' : 'Player 1');
    var p2Name = p2Val || 'Player 2';
    var maxHP = (mode === 'solo' || mode === 'solo_dagger') ? 20 : 10;
    
    var isDaggerMode = mode === 'solo_dagger';
    var initialDeck = makeDeck(isDaggerMode);
   
    historyStack = [];

    var starterWeaponP1 = null;
    var starterCeilingP1 = null;

    if (isDaggerMode) {
      starterWeaponP1 = {
        suit: 'diamonds',
        rank: '2',
        value: 2,
        name: CARD_NAMES['diamonds']['2'],
        id: 'diamonds2'
      };
      starterCeilingP1 = 14;
    }

    state = {
      mode: mode,
      maxHP: maxHP,
      p1Name: p1Name,
      p2Name: p2Name,
      deck: initialDeck,
      totalDeckSize: initialDeck.length,
      dungeon: [], selected: null, justFled: false, over: false,
      monstersSlain: 0,
      roomsCleared: 0,
      targetRooms: isDaggerMode ? 14 : 15,
      foodConsumed: 0,
      maxFoodHP: 54,
      weaponUsage: {},
      eventHistory: [],
      p1: { hp: maxHP, weapon: starterWeaponP1, ceiling: starterCeilingP1, consumedThisRoom: false },
      p2: { hp: maxHP, weapon: null, ceiling: null, consumedThisRoom: false },
      combinedUsedThisRoom: false
    };
   
    document.getElementById('setupScreen').style.display = 'none';
    document.getElementById('game').style.display = 'flex';
    document.getElementById('log').innerHTML = '';
    document.getElementById('runChart').innerHTML = '';
   
    var playersContainer = document.getElementById('playersContainer');
    var p2Panel = document.getElementById('p2Panel');
   
    document.getElementById('p1DisplayName').textContent = p1Name;
    document.getElementById('p2DisplayName').textContent = p2Name;
   
    if (mode === 'solo' || mode === 'solo_dagger') {
      p2Panel.style.display = 'none';
      playersContainer.classList.add('solo-mode');
    } else {
      p2Panel.style.display = 'flex';
      playersContainer.classList.remove('solo-mode');
    }
   
    fillDungeon(); 
    log('A new ' + (mode === 'coop' ? 'co-op' : (mode === 'solo_dagger' ? 'starter dagger' : 'solitaire')) + ' run begins.'); 
    if (isDaggerMode) {
      log(p1Name + ' steps into the dungeon wielding a Dagger (2♦).');
    }
    render();
  }

  function resetRoomLimits() {
    state.p1.consumedThisRoom = false;
    state.p2.consumedThisRoom = false;
    state.combinedUsedThisRoom = false;
  }

  function fillDungeon() {
    if (state.dungeon.length === 0 || state.dungeon.length === 1) {
      if (state.dungeon.length === 1) {
        state.roomsCleared++;
      }
      resetRoomLimits();
      while (state.dungeon.length < 4 && state.deck.length) {
        state.dungeon.push(state.deck.pop());
      }
    }
  }

  function refreshDungeon() {
    if (state.justFled || state.over || state.dungeon.length < 4 || state.deck.length === 0) return;
    saveState();
   
    var fledCards = state.dungeon.slice();
    state.dungeon = [];

    resetRoomLimits();
    while (state.dungeon.length < 4 && state.deck.length > 0) {
      state.dungeon.push(state.deck.pop());
    }

    state.deck.push.apply(state.deck, fledCards);
    shuffle(state.deck);

    state.selected = null;
    state.justFled = true;
    log('Fled! Dealt next room first, then shuffled fled cards into deck.', true, 'flee');
    checkGame();
    render();
  }

  function selectCard(i) {
    if (state.over) return;
    state.selected = i;
    render();
  }

  function cardHTML(c, customCornerText) {
    if (!c) return '';
    var red = c.suit === 'hearts' || c.suit === 'diamonds';
    var cornerText = customCornerText !== undefined ? customCornerText : (c.rank + '<br>' + SUITS[c.suit]);
    
    // Render custom SVG Artwork depending on card type:
    var centerArt = '';
    if (c.suit === 'clubs' && c.rank === 'A') {
      centerArt = '<div class="card-art">' + DRAGON_SVG + '</div>';
    } else if (c.suit === 'spades' && c.rank === 'A') {
      centerArt = '<div class="card-art">' + BONE_DRAGON_SVG + '</div>';
    } else if (c.suit === 'diamonds' && c.rank === '2') {
      centerArt = '<div class="card-art">' + DAGGER_SVG + '</div>';
    } else if (c.suit === 'diamonds' && c.rank === '3') {
      centerArt = '<div class="card-art">' + CLUB_SVG + '</div>';
    } else if (c.suit === 'diamonds' && c.rank === '4') {
      centerArt = '<div class="card-art">' + SHORT_SWORD_SVG + '</div>';
    } else {
      centerArt = '<div class="suitbig">' + SUITS[c.suit] + '</div>';
    }

    return '<div class="card ' + (red ? 'red' : 'black') + '">' +
      '<div class="corner">' + cornerText + '</div>' +
      centerArt +
      '<div class="card-title">' + c.name + '</div>' +
    '</div>';
  }

  function removeSelected() {
    var c = state.dungeon.splice(state.selected, 1)[0];
    state.selected = null;
    state.justFled = false;
    fillDungeon();
    return c;
  }

  function equipWeapon(player) {
    if (state.over || state.selected === null) return;
    var c = state.dungeon[state.selected], p = state[player];
    if (p.hp <= 0) { log(name(player) + ' is Downed and cannot take weapons.'); return; }
    saveState();
    var old = p.weapon;
    p.weapon = c;
    p.ceiling = 14;
    removeSelected();
    log(name(player) + ' equips ' + c.name + ' (' + c.rank + SUITS[c.suit] + ').' + (old ? ' (' + old.name + ' discarded)' : ''), true, 'weapon', player === 'p1' ? {p1:c.value,p2:null} : {p1:null,p2:c.value});
    checkGame();
    render();
  }

  function discardDungeonWeapon() {
    if (state.over || state.selected === null) return;
    saveState();
    var c = removeSelected();
    log('Discarded weapon ' + c.name + ' (' + c.rank + SUITS[c.suit] + ').');
    checkGame();
    render();
  }

  function discardDungeonPotion() {
    if (state.over || state.selected === null) return;
    saveState();
    var c = removeSelected();
    log('Discarded potion ' + c.name + ' (' + c.value + ' HP).');
    checkGame();
    render();
  }

  function drinkDirectPotion(target) {
    if (state.over || state.selected === null) return;
    var t = state[target];
    saveState();
    var c = state.dungeon[state.selected];
    var isDowned = t.hp === 0;

    var amount = 0;
    if (!t.consumedThisRoom) {
      amount = isDowned ? Math.floor(c.value / 2) + 1 : c.value;
      var actualHeal = Math.min(state.maxHP - t.hp, amount);
      t.hp = Math.min(state.maxHP, t.hp + amount);
      t.consumedThisRoom = true;
      if (actualHeal > 0) {
        state.foodConsumed += actualHeal;
      }
     
      if (isDowned) {
        log(name(target) + ' was revived by ' + c.name + ' with ' + amount + ' HP!', true, 'potion');
      } else {
        log(name(target) + ' consumes ' + c.name + ', restoring ' + amount + ' HP.', true, 'potion');
      }
    } else {
      log(name(target) + ' consumed ' + c.name + ', but already used a potion this room (restored 0 HP).', true, 'potion');
    }

    removeSelected();
    checkGame();
    render();
  }

  function validWeapon(p, c) { return p.weapon && p.ceiling !== null && c.value <= p.ceiling; }

  function trackWeaponKill(weaponName, monsterValue) {
    if (!state.weaponUsage[weaponName]) {
      state.weaponUsage[weaponName] = { uses: 0, ptsSlain: 0 };
    }
    state.weaponUsage[weaponName].uses += 1;
    state.weaponUsage[weaponName].ptsSlain += monsterValue;
  }

  function fight(player, mode) {
    if (state.over || state.selected === null) return;
    var c = state.dungeon[state.selected];
    if (['spades','clubs'].indexOf(c.suit) === -1) return;

    if (player === 'both') {
      var a = state.p1, b = state.p2;
      if (state.combinedUsedThisRoom) { log('Combined action already used this room.'); return; }
      if (a.hp <= 0 || b.hp <= 0) { log('Both players must be standing.'); return; }

      if (mode === 'combined_bare') {
        saveState();
        var totalDamage = c.value;
        applySharedDamage(totalDamage, 'p1');
        state.combinedUsedThisRoom = true;
        state.monstersSlain++;
        trackWeaponKill('Bare Fists', c.value);
        removeSelected();
        log('Both heroes team up vs ' + c.name + '. Took ' + totalDamage + ' damage split between them.', true, 'monster');
      } else {
        if (!a.weapon || !b.weapon || a.ceiling === null || b.ceiling === null || c.value > (a.ceiling + b.ceiling)) { log('Cannot combine weapons.'); return; }
        saveState();
        var power = a.weapon.value + b.weapon.value;
        var damage = Math.max(0, c.value - power);
       
        applySharedDamage(damage, 'p1');
        var targetCeiling = Math.floor(c.value / 2);
        a.ceiling = Math.min(a.ceiling, targetCeiling);
        b.ceiling = Math.min(b.ceiling, targetCeiling);
        state.combinedUsedThisRoom = true;
        state.monstersSlain++;

        trackWeaponKill(a.weapon.name, Math.floor(c.value / 2));
        trackWeaponKill(b.weapon.name, Math.ceil(c.value / 2));
       
        removeSelected();
        log('Combined weapons (' + power + ' pwr) vs ' + c.name + '. Taken ' + damage + ' damage.', true, 'monster');
      }
    } else {
      var p = state[player];
      if (p.hp <= 0) { log(name(player) + ' is Downed.'); return; }
      var damage = c.value;

      if (mode === 'weapon') {
        if (!validWeapon(p, c)) { log('Monster value exceeds weapon ceiling.'); return; }
        saveState();
        damage = Math.max(0, c.value - p.weapon.value);
        p.ceiling = Math.min(p.ceiling, c.value);
        trackWeaponKill(p.weapon.name, c.value);
      } else {
        saveState();
        trackWeaponKill('Bare Fists', c.value);
      }
     
      p.hp = Math.max(0, p.hp - damage);
      state.monstersSlain++;
      if (mode === 'weapon') {
        log(name(player) + ' uses ' + p.weapon.name + ' vs ' + c.name + '. Damage taken: ' + damage + '.', true, 'monster');
      } else {
        log(name(player) + ' enters Fist Fight with ' + c.name + ' and takes ' + damage + ' damage.', true, 'monster');
      }
      removeSelected();
    }
    checkGame();
    render();
  }

  function applySharedDamage(damage, acting) {
    var a = Math.floor(damage / 2), b = Math.floor(damage / 2);
    if (damage % 2) { if (acting === 'p2') b++; else a++; }
    state.p1.hp = Math.max(0, state.p1.hp - a);
    state.p2.hp = Math.max(0, state.p2.hp - b);
  }

  function checkGame() {
    var isSolo = state.mode === 'solo' || state.mode === 'solo_dagger';
    var isDead = isSolo ? state.p1.hp <= 0 : (state.p1.hp <= 0 && state.p2.hp <= 0);
   
    var totalCardsRemaining = state.deck.length + state.dungeon.length;
    var isCleared = totalCardsRemaining === 0;

    if (isDead || isCleared) {
      state.over = true;
      var title = "";
      var text = "";
      var score = 0;
      var scoreBanner = document.getElementById('modalScore');

      // Calculate remaining monsters
      var monsterSum = 0;
      var monstersRemainingCount = 0;
      var allRemaining = state.deck.concat(state.dungeon);
      for (var i = 0; i < allRemaining.length; i++) {
        var card = allRemaining[i];
        if (['spades','clubs'].indexOf(card.suit) !== -1) {
          monsterSum += card.value;
          monstersRemainingCount++;
        }
      }

      // Check special case: dying on the very last card after clearing all monsters
      var isPyrrhicVictory = isDead && isCleared && monstersRemainingCount === 0;

      if (isPyrrhicVictory) {
        title = "A Pyrrhic Victory!";
        score = 0;
        text = "You struck down the final beast of the dungeon, but took a mortal blow in the process. The dungeon is cleared, though none survived to tell the tale!";
        scoreBanner.className = 'score-banner';
        scoreBanner.textContent = 'SCORE: 0 (DRAW)';
      } else if (isCleared) {
        title = 'Dungeon Complete!';
        score = isSolo ? state.p1.hp : (state.p1.hp + state.p2.hp);
        text = 'You fully conquered all cards in the dungeon!';
        scoreBanner.className = 'score-banner';
        scoreBanner.textContent = 'SCORE: +' + score;
      } else {
        title = 'You Have Fallen';
        score = -monsterSum;
        text = 'The dungeon overcame your expedition.';
        scoreBanner.className = 'score-banner negative';
        scoreBanner.textContent = 'SCORE: ' + score;
      }

      // Calculate Best Weapon
      var favWeaponName = 'Bare Fists';
      var favWeaponPts = 0;
      var wKeys = Object.keys(state.weaponUsage || {});
      for (var k = 0; k < wKeys.length; k++) {
        var wName = wKeys[k];
        var data = state.weaponUsage[wName];
        if (data.ptsSlain > favWeaponPts) {
          favWeaponName = wName;
          favWeaponPts = data.ptsSlain;
        }
      }

      var favWeaponFormatted = favWeaponName + ' (' + favWeaponPts + ' damage dealt)';

      // Populate Run Summary Stats
      document.getElementById('summarySlain').textContent = state.monstersSlain + ' / 26';
      document.getElementById('summaryRooms').textContent = state.roomsCleared + ' / ' + (state.targetRooms || 15);
      document.getElementById('summaryFavWeapon').textContent = favWeaponFormatted;
      document.getElementById('summaryFood').textContent = state.foodConsumed + ' / ' + state.maxFoodHP + ' HP';

      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalText').innerHTML = text;
      renderRunChart();
      document.getElementById('overlay').classList.add('show');
    }
  }

  function name(p) { return p === 'p1' ? state.p1Name : state.p2Name; }

  function render() {
    var isSolo = state.mode === 'solo' || state.mode === 'solo_dagger';
    ['p1','p2'].forEach(function(id) {
      if (isSolo && id === 'p2') return;
      var p = state[id];
      document.getElementById(id + 'HP').textContent = p.hp + ' / ' + state.maxHP;
      document.getElementById(id + 'Bar').style.width = ((p.hp / state.maxHP) * 100) + '%';
      document.getElementById(id + 'Panel').classList.toggle('downed', p.hp === 0);
      document.getElementById(id + 'Down').innerHTML = p.hp === 0 ? '<span class="badge">DOWN</span>' : '';
      
      if (p.weapon) {
        var displayStats = 'ATK ' + p.weapon.value + '<br><span style="font-size:0.5rem; opacity:0.85;">MAX ' + p.ceiling + '</span>';
        document.getElementById(id + 'Weapon').innerHTML = cardHTML(p.weapon, displayStats);
        document.getElementById(id + 'WeaponMeta').textContent = p.weapon.name;
      } else {
        document.getElementById(id + 'Weapon').innerHTML = '';
        document.getElementById(id + 'WeaponMeta').textContent = 'Empty';
      }
    });

    var d = document.getElementById('dungeon');
    d.innerHTML = '';
    for (var i = 0; i < 4; i++) {
      (function(index) {
        var c = state.dungeon[index];
        var wrap = document.createElement('div');
        wrap.className = 'dungeon-card-wrap';
       
        if (c) {
          wrap.innerHTML = cardHTML(c);
          var cardEl = wrap.querySelector('.card');
          if (index === state.selected) cardEl.classList.add('selected');
          cardEl.onclick = function(e) {
            if (e) e.stopPropagation();
            selectCard(index);
          };
        } else {
          wrap.innerHTML = '<div class="card empty"></div>';
        }
        d.appendChild(wrap);
      })(i);
    }
   
    var currentDeck = state.deck.length;
    var totalDeck = state.totalDeckSize || (state.mode === 'solo_dagger' ? 43 : 44);
    var ratio = Math.max(0, Math.min(1, currentDeck / totalDeck));
   
    var deckBar = document.getElementById('deckBar');
    document.getElementById('deckCountText').textContent = currentDeck + ' / ' + totalDeck;
    deckBar.style.width = (ratio * 100) + '%';
   
    if (ratio > 0.5) {
      deckBar.style.backgroundColor = 'hsl(' + (120 * ((ratio - 0.5) * 2)) + ', 70%, 50%)';
    } else {
      deckBar.style.backgroundColor = 'hsl(' + (50 * (ratio * 2)) + ', 80%, 50%)';
    }

    var skipBtn = document.getElementById('refreshBtn');
    skipBtn.textContent = state.justFled ? "Fled" : "Flee";
    skipBtn.disabled = state.justFled || state.over || state.dungeon.length < 4 || state.deck.length === 0;

    var undoBtn = document.getElementById('undoBtn');
    undoBtn.disabled = historyStack.length === 0;

    var c = state.selected === null ? null : state.dungeon[state.selected];
    document.getElementById('selectedLabel').textContent = c ? (c.name + ' (' + c.rank + SUITS[c.suit] + ') — val ' + c.value) : 'Select card';

    var monster = c && ['spades','clubs'].indexOf(c.suit) !== -1;
    var weapon = c && c.suit === 'diamonds';
    var potion = c && c.suit === 'hearts';

    document.getElementById('fightOptions').classList.toggle('show', !!monster);
    document.getElementById('weaponOptions').classList.toggle('show', !!weapon);
    document.getElementById('potionOptions').classList.toggle('show', !!potion);

    var potionGrid = document.getElementById('potionGrid');
    var weaponGrid = document.getElementById('weaponGrid');
    var fightGrid = document.getElementById('fightGrid');

    if (potion) {
      if (isSolo) {
        potionGrid.style.gridTemplateColumns = '1fr 1fr';
        potionGrid.innerHTML = 
          '<button type="button" onclick="drinkDirectPotion(\'p1\')">Consume' + (state.p1.consumedThisRoom ? ' (+0 HP)' : '') + '</button>' +
          '<button type="button" onclick="discardDungeonPotion()">Discard</button>';
      } else {
        potionGrid.style.gridTemplateColumns = '1fr 1fr';
        potionGrid.innerHTML = 
          '<button type="button" onclick="drinkDirectPotion(\'p1\')">' + state.p1Name + ' Consume' + (state.p1.consumedThisRoom ? ' (+0 HP)' : '') + '</button>' +
          '<button type="button" onclick="drinkDirectPotion(\'p2\')">' + state.p2Name + ' Consume' + (state.p2.consumedThisRoom ? ' (+0 HP)' : '') + '</button>' +
          '<button type="button" onclick="discardDungeonPotion()" style="grid-column:1/-1">Discard Potion</button>';
      }
    }

    if (weapon) {
      if (isSolo) {
        weaponGrid.style.gridTemplateColumns = '1fr 1fr';
        weaponGrid.innerHTML = 
          '<button type="button" onclick="equipWeapon(\'p1\')">Equip</button>' +
          '<button type="button" onclick="discardDungeonWeapon()">Discard</button>';
      } else {
        weaponGrid.style.gridTemplateColumns = '1fr 1fr';
        weaponGrid.innerHTML = 
          '<button type="button" onclick="equipWeapon(\'p1\')"' + (state.p1.hp === 0 ? ' disabled' : '') + '>' + state.p1Name + ' Equip</button>' +
          '<button type="button" onclick="equipWeapon(\'p2\')"' + (state.p2.hp === 0 ? ' disabled' : '') + '>' + state.p2Name + ' Equip</button>' +
          '<button type="button" onclick="discardDungeonWeapon()" style="grid-column:1/-1">Discard Weapon</button>';
      }
    }

    if (monster) {
      if (isSolo) {
        fightGrid.style.gridTemplateColumns = '1fr 1fr';
        fightGrid.innerHTML = 
          '<button type="button" onclick="fight(\'p1\',\'weapon\')" id="p1WeaponFight">Weapon</button>' +
          '<button type="button" onclick="fight(\'p1\',\'bare\')" id="p1BareFight">Fist Fight</button>';
        document.getElementById('p1WeaponFight').disabled = !validWeapon(state.p1, c) || state.p1.hp === 0;
        document.getElementById('p1BareFight').disabled = state.p1.hp === 0;
      } else {
        fightGrid.style.gridTemplateColumns = '1fr 1fr';
        fightGrid.innerHTML = 
          '<button type="button" onclick="fight(\'p1\',\'weapon\')" id="p1WeaponFight" style="grid-column:1">' + state.p1Name + ' Weapon</button>' +
          '<button type="button" onclick="fight(\'p2\',\'weapon\')" id="p2WeaponFight" style="grid-column:2">' + state.p2Name + ' Weapon</button>' +
          '<button type="button" onclick="fight(\'p1\',\'bare\')" id="p1BareFight" style="grid-column:1">' + state.p1Name + ' Fist Fight</button>' +
          '<button type="button" onclick="fight(\'p2\',\'bare\')" id="p2BareFight" style="grid-column:2">' + state.p2Name + ' Fist Fight</button>' +
          '<button type="button" onclick="fight(\'both\',\'combined\')" id="combinedFight" style="grid-column:1/-1">⚔️ Both Combine Weapons</button>' +
          '<button type="button" onclick="fight(\'both\',\'combined_bare\')" id="combinedBareFight" style="grid-column:1/-1">👊 Both 2v1 Fist Fight</button>';
        document.getElementById('p1WeaponFight').disabled = !validWeapon(state.p1, c) || state.p1.hp === 0;
        document.getElementById('p2WeaponFight').disabled = !validWeapon(state.p2, c) || state.p2.hp === 0;
        document.getElementById('p1BareFight').disabled = state.p1.hp === 0;
        document.getElementById('p2BareFight').disabled = state.p2.hp === 0;
        
        var okCombinedWeapon = state.p1.weapon && state.p2.weapon && state.p1.ceiling !== null && state.p2.ceiling !== null && state.p1.hp > 0 && state.p2.hp > 0 && (c.value) <= (state.p1.ceiling + state.p2.ceiling) && !state.combinedUsedThisRoom;
        document.getElementById('combinedFight').disabled = !okCombinedWeapon;

        var okCombinedBare = state.p1.hp > 0 && state.p2.hp > 0 && !state.combinedUsedThisRoom;
        document.getElementById('combinedBareFight').disabled = !okCombinedBare;
      }
    }
  }

  function log(text, recordEvent, eventType, weaponStrengths) {
    var box = document.getElementById('log');
    if (box) box.innerHTML = '<div class="logline">• ' + text + '</div>' + box.innerHTML;

    // Keep a compact structured history alongside the visible text log.
    // The graph uses event order as the run's X-axis because the game has no
    // real-world clock/timestamp associated with individual actions.
    if (recordEvent !== false && state && state.p1 && Array.isArray(state.eventHistory)) {
      state.eventHistory.push({
        text: String(text),
        type: (arguments.length >= 3 && arguments[2]) ? arguments[2] : 'other',
        p1hp: state.p1.hp,
        p2hp: state.p2 ? state.p2.hp : null,
        p1Ceiling: state.p1.ceiling,
        p2Ceiling: state.p2 ? state.p2.ceiling : null,
        p1WeaponStrength: (arguments.length >= 4 && arguments[3]) ? arguments[3].p1 : null,
        p2WeaponStrength: (arguments.length >= 4 && arguments[3]) ? arguments[3].p2 : null,
        monstersSlain: state.monstersSlain || 0,
        roomsCleared: state.roomsCleared || 0
      });
    }
  }

  function xmlEscape(text) {
    return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function renderRunChart() {
    var target = document.getElementById('runChart');
    var legend = document.getElementById('runChartLegend');
    if (!target) return;

    var events = Array.isArray(state.eventHistory) ? state.eventHistory : [];
    if (!events.length) {
      target.innerHTML = '<div style="padding:10px;color:var(--muted);font-size:0.75rem;">No run history recorded.</div>';
      if (legend) legend.innerHTML = '';
      return;
    }

    var isSolo = state.mode === 'solo' || state.mode === 'solo_dagger';
    var W = 720, H = 300;
    var left = 54, right = 12, top = 22, bottom = 252;
    var plotW = W - left - right;
    var hpH = bottom - top;
    var maxHP = state.maxHP || 20;
    var n = events.length;
    var x = function(i) { return left + (n === 1 ? plotW / 2 : (i / (n - 1)) * plotW); };
    var hpY = function(v) { return bottom - (Math.max(0, Math.min(maxHP, v)) / maxHP) * hpH; };

    var parts = [];
    parts.push('<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Run health history over event order">');
    parts.push('<line class="grid-line" x1="' + left + '" y1="' + hpY(maxHP) + '" x2="' + (W-right) + '" y2="' + hpY(maxHP) + '"/>');
    parts.push('<line class="grid-line" x1="' + left + '" y1="' + hpY(maxHP/2) + '" x2="' + (W-right) + '" y2="' + hpY(maxHP/2) + '"/>');
    parts.push('<line class="grid-line" x1="' + left + '" y1="' + hpY(0) + '" x2="' + (W-right) + '" y2="' + hpY(0) + '"/>');
    parts.push('<line class="axis-line" x1="' + left + '" y1="' + top + '" x2="' + left + '" y2="' + bottom + '"/>');
    parts.push('<line class="axis-line" x1="' + left + '" y1="' + bottom + '" x2="' + (W-right) + '" y2="' + bottom + '"/>');
    parts.push('<text class="panel-label" x="' + left + '" y="13">Health</text>');
    parts.push('<text class="axis-label" text-anchor="end" x="' + (left-7) + '" y="' + (hpY(maxHP)+4) + '">' + maxHP + '</text>');
    parts.push('<text class="axis-label" text-anchor="end" x="' + (left-7) + '" y="' + (hpY(maxHP/2)+4) + '">' + Math.round(maxHP/2) + '</text>');
    parts.push('<text class="axis-label" text-anchor="end" x="' + (left-7) + '" y="' + (hpY(0)+4) + '">0</text>');

    var p1HpPoints = events.map(function(e,i){ return x(i)+','+hpY(e.p1hp); }).join(' ');
    parts.push('<polyline class="hp-line" points="' + p1HpPoints + '"/>');
    if (!isSolo) {
      var p2HpPoints = events.map(function(e,i){ return x(i)+','+hpY(e.p2hp == null ? 0 : e.p2hp); }).join(' ');
      parts.push('<polyline class="hp-line p2" points="' + p2HpPoints + '"/>');
    }

    events.forEach(function(e,i){
      var cls = ['monster','weapon','potion','flee'].indexOf(e.type) >= 0 ? e.type : 'other';
      var py = hpY(e.p1hp);
      var title = 'Event ' + (i+1) + ': ' + e.text;
      parts.push('<circle class="event-dot ' + cls + '" cx="' + x(i) + '" cy="' + py + '" r="4.5"><title>' + xmlEscape(title) + '</title></circle>');
      if (!isSolo && e.p2hp != null) {
        parts.push('<circle class="event-dot ' + cls + ' alt" cx="' + x(i) + '" cy="' + hpY(e.p2hp) + '" r="3.7"><title>' + xmlEscape(title) + '</title></circle>');
      }
    });

    var ticks = n === 1 ? [0] : [0, Math.floor((n-1)/2), n-1];
    var used = {};
    ticks.forEach(function(i){
      if (used[i]) return; used[i]=true;
      parts.push('<line class="axis-line" x1="' + x(i) + '" y1="' + bottom + '" x2="' + x(i) + '" y2="' + (bottom+4) + '"/>');
      parts.push('<text class="axis-label" text-anchor="middle" x="' + x(i) + '" y="' + (bottom+17) + '">' + (i+1) + '</text>');
    });
    parts.push('<text class="axis-label" text-anchor="middle" x="' + (W/2) + '" y="' + (H-5) + '">Event order</text>');
    parts.push('</svg>');
    target.innerHTML = parts.join('');

    if (legend) {
      var legendHtml = '';
      legendHtml += '<span class="run-chart-legend-item"><span class="run-chart-legend-line"></span>' + xmlEscape(state.p1Name || 'Player 1') + '</span>';
      if (!isSolo) legendHtml += '<span class="run-chart-legend-item"><span class="run-chart-legend-line p2"></span>' + xmlEscape(state.p2Name || 'Player 2') + '</span>';
      legendHtml += '<span class="run-chart-legend-item"><span class="run-chart-legend-dot monster"></span>Monster fight</span>';
      legendHtml += '<span class="run-chart-legend-item"><span class="run-chart-legend-dot weapon"></span>Weapon equipped</span>';
      legendHtml += '<span class="run-chart-legend-item"><span class="run-chart-legend-dot potion"></span>Potion drank</span>';
      legendHtml += '<span class="run-chart-legend-item"><span class="run-chart-legend-dot flee"></span>Room fled</span>';
      legend.innerHTML = legendHtml;
    }
  }

  // Peek Event Handlers (Keyboard + Touch/Mouse)
  function setupPeekHandlers() {
    var overlay = document.getElementById('overlay');
    var peekBtn = document.getElementById('peekBtn');

    var setPeek = function(isPeeking) {
      if (isPeeking) {
        overlay.classList.add('peek-hidden');
      } else {
        overlay.classList.remove('peek-hidden');
      }
    };

    // Keyboard handlers [V]
    window.addEventListener('keydown', function(e) {
      if (e.key === 'v' || e.key === 'V') setPeek(true);
    });
    window.addEventListener('keyup', function(e) {
      if (e.key === 'v' || e.key === 'V') setPeek(false);
    });

    // Touch & Mouse events for peek button
    peekBtn.addEventListener('mousedown', function() { setPeek(true); });
    peekBtn.addEventListener('mouseup', function() { setPeek(false); });
    peekBtn.addEventListener('touchstart', function(e) { e.preventDefault(); setPeek(true); });
    peekBtn.addEventListener('touchend', function(e) { e.preventDefault(); setPeek(false); });
  }

  // Initial load execution
  window.onload = function() {
    toggleModeInputs();
    setupPeekHandlers();
  };
</script>
</body>
</html>
